CTS 1000: CTS*1000 is a course dedicated to learning what keywords are, and their meanings, in context of the works of digital humanities and non-digital humanities. An interdisciplinary cross-study course, these are the projects undertaken during the term.
CTS 2010: CTS*2010 is a course dedicated to being introduced to the tools and methodologies pursued by Digital Humanities scholarship done through a focus on a piece of technology that is explored from multiple perspectives across assignments.
CTS 3000: CTS*3000 is a highly theoretical course dedicated to understanding the ethics of data from an interdisciplinary perspective including but not limited to surveillance, neoliberalism, panopticonism, and critical theory.
CTS 3030: CTS*3030 is a course where you attend a workshop of choice and using what is learned from the workshop, as well as what you learn from the class readings on digital humanities projects and methodology, you develop your own project independently with instructor support.
CTS 3020: CTS*3020 is a course exploring the world of digital stories, including debates on what makes a digital story a digital story, with a focus on how social justice movements are contextualised within the frames of digital storytelling.