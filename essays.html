---
layout: page
title: Essays
permalink: /essays/
---

{% assign essays_by_year = site.essays | group_by_exp: "essay", "essay.date | date: '%Y'" %}
{% for year in essays_by_year %}
  <h2>{{ year.name }}</h2>
  <ul>
  {% for essay in year.items %}
    <li><a href="{{ essay.url }}">{{ essay.title }}</a></li>
  {% endfor %}
  </ul>
{% endfor %}
